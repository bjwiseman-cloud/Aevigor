# Deploys the beta's server code to Supabase, and runs the twice-daily sync for every tester.
# Only one repository secret is needed (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  access token from supabase.com/dashboard/account/tokens
# The encryption key and the sync password come from the project's own service-role key (see supabase/functions/api).
# New files in supabase/migrations are run on the database first (each once, in name order, recorded in
# public.schema_migrations), then the function is deployed.
name: Beta server

env:
  PROJECT_REF: oxhrmxydlnzvqidsjcbg   # aevigor-beta (not a secret: it is part of the public app address)

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/migrations/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'   # 7:00 am Alberta (MST)
    - cron: '0 19 * * *'   # 12:00 pm Alberta (MST)

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/rules.test.mjs && node tests/sync.test.mjs
      - name: Run new database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          q() {  # run SQL through the Supabase Management API; fails the job on any SQL error
            jq -n --arg q "$1" '{query: $q}' > /tmp/body.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' --data @/tmp/body.json)
            if [ "${code:0:1}" != "2" ]; then echo "SQL failed ($code):"; head -c 800 /tmp/out.json; echo; exit 1; fi
          }
          # The first three migrations were run by hand during setup, so they start as already applied.
          q "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now());
             alter table public.schema_migrations enable row level security;
             insert into public.schema_migrations (name) values ('20261116000000_beta.sql'), ('20261117000000_load.sql'), ('20261118000000_admin.sql') on conflict do nothing;"
          q "select coalesce(json_agg(name), '[]'::json) as names from public.schema_migrations"
          applied=$(jq -r '.[0].names[]' /tmp/out.json)
          for f in $(ls supabase/migrations/*.sql | sort); do
            name=$(basename "$f")
            if grep -qxF "$name" <<< "$applied"; then continue; fi
            echo "Applying $name"
            q "$(cat "$f")"
            q "insert into public.schema_migrations (name) values ('$name')"
          done
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Set function settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets set --yes --project-ref "$PROJECT_REF" BETA_ALLOWED_ORIGINS="https://aevigor.com,https://www.aevigor.com"
      - name: Deploy the api function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --yes --project-ref "$PROJECT_REF" --no-verify-jwt

  sync-everyone:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Sync all testers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$KEY"
          test -n "$KEY"
          curl -sS --fail-with-body -X POST "https://$PROJECT_REF.supabase.co/functions/v1/api/cron" \
            -H "Authorization: Bearer $KEY" -H "content-type: application/json" -d '{}' \
            | head -c 300
