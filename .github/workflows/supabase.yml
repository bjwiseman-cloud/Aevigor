# Deploys the beta's server code to Supabase, and runs the twice-daily sync for every tester.
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project id (the part before .supabase.co in the project URL)
#   BETA_ENCRYPTION_KEY    long random password used to encrypt intervals.icu keys (never change it)
#   BETA_CRON_SECRET       long random password that lets this workflow start the sync
name: Beta server

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'   # 7:00 am Alberta (MST)
    - cron: '0 19 * * *'   # 12:00 pm Alberta (MST)

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/rules.test.mjs && node tests/sync.test.mjs
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Set function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            BETA_ENCRYPTION_KEY="${{ secrets.BETA_ENCRYPTION_KEY }}" \
            BETA_CRON_SECRET="${{ secrets.BETA_CRON_SECRET }}" \
            BETA_ALLOWED_ORIGINS="https://aevigor.com,https://www.aevigor.com"
      - name: Deploy the api function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt

  sync-everyone:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Sync all testers
        run: |
          curl -sS --fail-with-body -X POST "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api/cron" \
            -H "x-cron-secret: ${{ secrets.BETA_CRON_SECRET }}" -H "content-type: application/json" -d '{}' \
            | head -c 300
