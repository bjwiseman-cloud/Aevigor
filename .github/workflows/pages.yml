# Publishes aevigor.com: the website files as they are, plus the beta app built from web/ into /beta.
# One-time: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build the beta app
        working-directory: web
        run: npm ci && npm run build
      - name: Put the site together
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude web --exclude supabase --exclude tests --exclude docs --exclude _site ./ _site/
          mkdir -p _site/beta && cp -r web/dist/. _site/beta/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
