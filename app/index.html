<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aevigor</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #f3eee3; --ink: #171615; --muted: #5d574f; --accent: #b4381f; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171513; --ink: #ece6da; --muted: #a59d90; --accent: #d2ae66; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: var(--bg); color: var(--ink); z-index: 2; transition: opacity .4s;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Times New Roman", Georgia, serif; font-size: 22px; letter-spacing: 6px; }
  #splash img { width: 88px; height: 88px; border-radius: 20px; animation: pulse 1.8s ease-in-out infinite; }
  #splash .rule { width: 48px; height: 2px; background: var(--accent); }
  #splash small { font-family: "Zen Kaku Gothic New", "Segoe UI", system-ui, sans-serif; font-size: 12px; letter-spacing: 1px; color: var(--muted); max-width: 260px; text-align: center; line-height: 1.6; }
  @keyframes pulse { 50% { transform: scale(1.04); opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><div>AEVIGOR</div><div class="rule"></div><small id="msg">Loading…</small></div>
<iframe id="app" title="Aevigor" allow="clipboard-write"></iframe>
<script>
  // The app itself runs on Google Apps Script. This page shows it full screen, with its own icon and no browser bars.
  var APP = 'https://script.google.com/macros/s/AKfycbzkB6BQSwbg0Zx0q7zFXK_UX1czTi0k2y4I6IMcTR3RhnZ7FkyplW8DZfKVkJAAEQ/exec';
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  // The hash holds the page plus any settings, e.g. #trends&r=84
  function page() { return (location.hash || '#home').slice(1) || 'home'; }
  function open(h) {
    var m = /^([a-z]+)((?:&[a-z0-9_]+=[A-Za-z0-9_.-]*)*)$/.exec(h) || [0, 'home', ''];
    splash.style.opacity = 1; splash.style.display = 'flex';
    var url = APP + '?p=' + m[1] + m[2] + '&embed=1';
    // replace() keeps the frame out of the back-button history, so Back steps through pages once each
    if (frame.src) { try { frame.contentWindow.location.replace(url); return; } catch (e) {} }
    frame.src = url;
  }
  frame.addEventListener('load', function () { splash.style.opacity = 0; setTimeout(function () { splash.style.display = 'none'; }, 400); });
  // The app's tab bar asks this page to switch pages, so you never leave the full-screen view.
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!d.bgNav || !/^[a-z]+$/.test(d.bgNav)) return;
    var h = d.bgNav + (/^(&[a-z0-9_]+=[A-Za-z0-9_.-]*)*$/.test(d.extra || '') ? d.extra || '' : '');
    if (location.hash !== '#' + h) history.pushState(null, '', '#' + h);
    open(h);
  });
  window.addEventListener('popstate', function () { open(page()); });
  setTimeout(function () { document.getElementById('msg').textContent = 'Still loading. Google can take a few seconds to wake the app.'; }, 7000);
  open(page());
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
